name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LegalDoc-FrontEnd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LegalDoc-FrontEnd/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint frontend (if configured)
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build

  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LegalDOCAI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile critical backend modules
        run: |
          python -m py_compile main.py
          python -m py_compile backend/app/routes/__init__.py
          python -m py_compile backend/app/routes/ai.py

      - name: Run backend smoke tests
        run: pytest -q
